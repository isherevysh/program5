<!DOCTYPE html>
<html>
<head>
    <title>Notes Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>My Note Manager</h1>
        <p>Create and manage your notes</p>
    </header>

    <div class="content">
        <h2>Add Notes</h2>

        <input id="note" placeholder="Enter your notes">
        <button onclick="addNote()">Add Note</button>

        <h2>My Notes</h2>
        <div id="notes"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
